<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🏢 Employee Portal</span>
    <span class="text-white-50 small">AI-Powered HR Dashboard</span>
  </nav>

  <div class="container-fluid py-4 px-4">

    <!-- Stat Cards -->
    <div class="row g-3 mb-4" id="stat-cards">
      <div class="col-md-3">
        <div class="card stat-card border-0">
          <div class="card-body">
            <p class="text-muted small mb-1">Total Employees</p>
            <h3 id="total-count">—</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card border-0">
          <div class="card-body">
            <p class="text-muted small mb-1">Departments</p>
            <h3>3</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card border-0">
          <div class="card-body">
            <p class="text-muted small mb-1">Active</p>
            <h3 id="active-count">—</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card border-0">
          <div class="card-body">
            <p class="text-muted small mb-1">AI Features</p>
            <h3>✨ ON</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Search + Add Button -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <input type="text" id="search-input" class="form-control w-50"
             placeholder="Search employees by name or email...">
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
        + Add Employee
      </button>
    </div>

    <!-- Employee Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Designation</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="emp-table-body">
            <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- AI JD Output -->
    <div class="card border-0 shadow-sm mt-4" id="jd-card" style="display:none">
      <div class="card-header bg-dark text-white">✨ AI Generated Job Description</div>
      <div class="card-body">
        <pre id="jd-output" class="mb-0" style="white-space:pre-wrap"></pre>
      </div>
    </div>

  </div>

  <!-- Add Employee Modal -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Employee</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="add-firstName" class="form-control mb-2" placeholder="First Name">
          <input type="text" id="add-lastName"  class="form-control mb-2" placeholder="Last Name">
          <input type="email" id="add-email"     class="form-control mb-2" placeholder="Email">
          <input type="text" id="add-phone"      class="form-control mb-2" placeholder="Phone">
          <input type="text" id="add-designation" class="form-control mb-2" placeholder="Designation">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="addEmployee()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
